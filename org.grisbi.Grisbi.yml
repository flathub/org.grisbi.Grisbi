app-id: org.grisbi.Grisbi
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.gnome.Sdk.Locale
command: grisbi

rename-icon: grisbi

finish-args:
  - --socket=x11
  # - --socket=wayland
  # - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Ideally we would only need access to xdg-documents and xdg-download, but
  # the default account filename is in $HOME.
  - --filesystem=home

cleanup:
  - /include
  - '*.a'

modules:

  - shared-modules/intltool/intltool-0.51.json

  - name: libgsf
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libgsf/1.14/libgsf-1.14.58.tar.xz
        sha256: 06e07ea12b7a52b9e316faddfecb640b1717a4875c59f0efb3b0cec1e2ccf35a
        x-checker-data:
          type: anitya
          project-id: 1980
          url-template: https://download.gnome.org/sources/libgsf/$major.$minor/libgsf-$version.tar.xz

  - name: opensp
    config-opts:
      - --disable-doc-build
    sources:
      - type: archive
        url: http://downloads.sourceforge.net/project/openjade/opensp/1.5.2/OpenSP-1.5.2.tar.gz
        sha256: 57f4898498a368918b0d49c826aa434bb5b703d2c3b169beb348016ab25617ce
        x-checker-data:
          type: anitya
          project-id: 377818
          url-template: http://downloads.sourceforge.net/project/openjade/opensp/$version/OpenSP-$version.tar.gz
      - type: shell
        commands:
          - autoreconf -vfi

  - name: libofx
    config-opts:
      - --with-opensp-includes=/app/include/OpenSP
      - --with-opensp-lib=/app/lib
      - --disable-gengetopt
      - --disable-tools
    sources:
      - type: archive
        url: https://github.com/libofx/libofx/archive/refs/tags/0.10.9.tar.gz
        sha256: ea9fa07759622ecc7f25b637fa8fb34d587af80607ca4389d25966a6a4f94ab9
        x-checker-data:
          type: anitya
          project-id: 7309
          url-template: https://github.com/libofx/libofx/archive/refs/tags/$version.tar.gz

  - name: grisbi
    buildsystem: autotools
    sources:
      - type: archive
        url: http://downloads.sourceforge.net/project/grisbi/grisbi%20stable/3.0.x/3.90.1/grisbi-3.90.1.tar.xz
        sha256: 2d7632b4d07189d9189d8d2c7caded309ff0622405234d1886217a7dca9882a8
        x-checker-data:
          type: anitya
          project-id: 8916
          url-template: http://downloads.sourceforge.net/project/grisbi/grisbi%20stable/$major.0.x/$version/grisbi-$version.tar.xz
      - type: file
        path: metainfo.patch
    post-install:
      - mv /app/share/metainfo/grisbi.metainfo.xml /app/share/metainfo/org.grisbi.Grisbi.metainfo.xml
      # https://github.com/grisbi/grisbi/pull/73
      - sed -i -e 's,<_,<,g;s,</_,</,g' /app/share/metainfo/org.grisbi.Grisbi.metainfo.xml
      - sed -i -e '/<description>/i\  <developer_name>Grisbi Team</developer_name>'
        /app/share/metainfo/org.grisbi.Grisbi.metainfo.xml
      # Add the latest release
      - patch /app/share/metainfo/org.grisbi.Grisbi.metainfo.xml < metainfo.patch
      - mv /app/share/mime/packages/grisbi.xml /app/share/mime/packages/org.grisbi.Grisbi.xml
      - mv /app/share/icons/hicolor/scalable/mimetypes/application-x-grisbi.svg /app/share/icons/hicolor/scalable/mimetypes/org.grisbi.Grisbi.application-x-grisbi.svg
